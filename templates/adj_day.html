<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Load Graph and Table</title>
    <link rel="stylesheet" href="../static/styles_upload.css">
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            showResult(); // 페이지가 로드되면 바로 showResult 함수 실행
        });

        function showResult() {
            fetch('/day_backtest_adj', {
                method: 'POST'
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                const iframeDiv = document.createElement('div');
                iframeDiv.className = "center";
                iframeDiv.innerHTML = `
                    <iframe src="{{ url_for('static', filename='day_report_adj.html') }}" width="1500" height="900" frameborder="0"></iframe>
                `;
                document.body.appendChild(iframeDiv);

                const sortedData = Object.entries(data).sort((a, b) => a[1].return_rate - b[1].return_rate);
                const sortedData_up = Object.entries(data).sort((a, b) => b[1].return_rate -  a[1].return_rate);

                const top5 = sortedData_up.slice(0, 5);
                const bottom5 = sortedData.slice(0, 5);

                const tablesContainer = document.createElement('div');
                tablesContainer.className = 'tables-container';
                document.body.appendChild(tablesContainer);

                createTable('Top 5 Stocks', top5, tablesContainer);
                createTable('Bottom 5 Stocks', bottom5, tablesContainer);

                return fetch('/sorted_stocks_adj', {
                    method: 'POST'
                });
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                createLastTable(data);
            })
            .catch(error => {
                console.error('There was a problem with the fetch operation:', error);
            });
        }

        function createTable(title, data, container) {
            const tableDiv = document.createElement('div');
            tableDiv.className = "stock-table";
            
            const header = document.createElement('h2');
            header.textContent = title;
            tableDiv.appendChild(header);
            
            const table = document.createElement('table');
            table.border = "1";
            
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            const th1 = document.createElement('th');
            th1.textContent = "Stock";
            const th2 = document.createElement('th');
            th2.textContent = "Return Rate";
            headerRow.appendChild(th1);
            headerRow.appendChild(th2);
            thead.appendChild(headerRow);
            table.appendChild(thead);
            
            const tbody = document.createElement('tbody');
            data.forEach(([stock, {return_rate}]) => {
                const row = document.createElement('tr');
                const td1 = document.createElement('td');
                td1.textContent = stock;
                const td2 = document.createElement('td');
                td2.textContent = (return_rate * 100).toFixed(2) + '%';
                row.appendChild(td1);
                row.appendChild(td2);
                tbody.appendChild(row);
            });
            table.appendChild(tbody);
            tableDiv.appendChild(table);
            container.appendChild(tableDiv);
        }

        function sortTable(table, column, ascending) {
            const tbody = table.tBodies[0];
            const rows = Array.from(tbody.querySelectorAll('tr'));

            const compare = (rowA, rowB) => {
                const cellA = rowA.children[column].innerText;
                const cellB = rowB.children[column].innerText;
                const a = isNaN(cellA) ? cellA : Number(cellA);
                const b = isNaN(cellB) ? cellB : Number(cellB);

                return (a > b ? 1 : a < b ? -1 : 0) * (ascending ? 1 : -1);
            };

            rows.sort(compare);

            rows.forEach(row => {
                row.classList.remove('hidden-row');
                tbody.appendChild(row);
            });

            rows.slice(5).forEach(row => row.classList.add('hidden-row'));
        }

        function makeTableSortable(table) {
            const headers = table.querySelectorAll('th');
            headers.forEach((header, index) => {
                header.addEventListener('click', () => {
                    const ascending = !header.classList.contains('asc');
                    headers.forEach(h => h.classList.remove('asc', 'desc'));
                    header.classList.toggle('asc', ascending);
                    header.classList.toggle('desc', !ascending);
                    sortTable(table, index, ascending);
                });
            });
        }

        function createLastTable(data) {
            const tableDiv = document.createElement('div');
            tableDiv.className = "center-table";
            
            let tableHtml = '<table border="1"><thead><tr>';
            const headers = ['Stock', 'Buy', 'Sell', 'Total', 
                        'CR < 0%', 'CR < -4%', 
                        'CR < -8%', 'CR < -12%'];

            headers.forEach(key => {
                tableHtml += `<th>${key}</th>`;
            });
            tableHtml += '</tr></thead><tbody>';

            data.forEach(item => {
                tableHtml += '<tr>';
                headers.forEach(key => {
                    tableHtml += `<td>${item[key]}</td>`;
                });
                tableHtml += '</tr>';
            });

            tableHtml += '</tbody></table>';
            tableDiv.innerHTML = tableHtml;
            document.body.appendChild(tableDiv);

            const table = tableDiv.querySelector('table');
            makeTableSortable(table);

            const tbody = table.tBodies[0];
            const rows = Array.from(tbody.querySelectorAll('tr'));
            rows.slice(5).forEach(row => row.classList.add('hidden-row'));
        }
    </script>
</head>
<body>
    <h1>Auto Load Graph and Table</h1>
    <div id="tableContainer"></div>
</body>
</html>
